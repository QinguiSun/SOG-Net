name: ELEMENTA training CPU checks
on:
  pull_request:
    paths:
      - 'CACE-SOG/cace_sog_training/**'
      - 'CACE-SOG/dpa4c_sog/**'
      - 'CACE-SOG/tests/**'
      - 'CACE-SOG/examples/elementa/**'
      - 'CACE-SOG/examples/dpa4c/**'
      - '.github/workflows/elementa-training.yml'
  push:
    branches: [main]
    paths:
      - 'CACE-SOG/cace_sog_training/**'
      - 'CACE-SOG/dpa4c_sog/**'
      - 'CACE-SOG/tests/**'
      - '.github/workflows/elementa-training.yml'
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy ase matscipy pytorch-finufft lightning pytest dpdispatcher==1.1.0
      - name: Test data integrity, force gradients, restart and CLI workflow
        working-directory: CACE-SOG
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MPLCONFIGDIR: /tmp/elementa-mpl
        run: python -m pytest tests/test_elementa_*.py tests/test_dpa4c_*.py -q
      - name: Check SCNet shell entry points
        working-directory: CACE-SOG
        run: |
          bash -n examples/elementa/run_single_gpu.sh
          bash -n examples/elementa/train_a800.sbatch
          bash -n examples/elementa/index_cpu.sbatch
          bash -n examples/dpa4c/baseline_a800.sbatch
  windows-preprocessing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU-only preprocessing and controller dependencies
        run: python -m pip install numpy ase pytest dpdispatcher==1.1.0
      - name: Verify native Windows indexing, portable binding and offline submission
        working-directory: CACE-SOG
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_elementa_data.py tests/test_elementa_baseline.py tests/test_elementa_transfer.py tests/test_elementa_dispatch.py tests/test_elementa_portable_cli.py tests/test_dpa4c_convert.py tests/test_dpa4c_integrity.py tests/test_dpa4c_alignment.py tests/test_dpa4c_prepare.py tests/test_dpa4c_predict.py tests/test_dpa4c_validate.py tests/test_dpa4c_metrics.py tests/test_dpa4c_pipeline.py tests/test_dpa4c_smoke.py tests/test_dpa4c_preflight.py tests/test_dpa4c_index_smoke.py -q
      - name: Check Windows preprocessing script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'CACE-SOG/examples/elementa/prepare_windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
